<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DbD Database & Games</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
    <header class="main-header">
        <h1>REINO DEL ENTE</h1>
        <div class="tabs">
            <button onclick="render('killer')">Ver Asesinos</button>
            <button onclick="render('survivor')">Ver Supervivientes</button>
            <button onclick="startGameMode('archive')" class="archive-btn">LOS ARCHIVOS (Jugar)</button>
        </div>
        <input type="text" id="search" placeholder="Buscar por nombre..." onkeyup="filterData()">
    </header>

    <div id="game-area" class="container">
        <!-- Vista de catálogo -->
        <div id="content-display" class="grid-container"></div>
        
        <!-- Vista de juego DbDle -->
        <div id="archive-ui" class="hidden archive-dbdle-container">
            <div class="dbdle-input-wrapper">
                <input type="text" id="char-search-input" placeholder="Buscar personaje para deducir...">
                <div id="autocomplete-list" class="autocomplete-items hidden"></div>
            </div>
            <div class="dbdle-table">
                <div class="dbdle-header">
                    <div>Sujeto</div><div>Rol</div><div>Género</div><div>Velocidad</div><div>Año</div>
                </div>
                <div id="guesses-grid" class="guesses-grid"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
